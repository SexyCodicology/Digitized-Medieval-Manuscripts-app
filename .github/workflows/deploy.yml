name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'tests/**'
      - 'mkdocs.yml'
      - 'schema.json'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'overrides/**'
      - 'tests/**'
      - 'mkdocs.yml'
      - 'schema.json'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Cache pip packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache privacy plugin assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/plugin/privacy
          key: ${{ runner.os }}-mkdocs-privacy-${{ hashFiles('mkdocs.yml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-privacy-

      - name: Cache social plugin cards
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/plugin/social
          key: ${{ runner.os }}-mkdocs-social-${{ hashFiles('mkdocs.yml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-social-

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate data.json
        run: python scripts/validate_data.py

      - name: Test Build Hooks
        run: pytest tests -q

      - name: Build MkDocs Site
        run: mkdocs build --clean

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'site'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
