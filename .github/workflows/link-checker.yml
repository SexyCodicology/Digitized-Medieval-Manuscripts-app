name: Link Health Check

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  # create-issue-from-file files the human-readable weekly report.
  issues: write
  # create-pull-request pushes the proposal branch and opens the pull request.
  # The dataset is never written on master directly: a status only reaches the
  # public site once a human has confirmed it.
  contents: write
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Links in data.json
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: '--verbose --no-progress --timeout 10 ./docs/assets/data.json'
          fail: false
          output: ./lychee-report.md

      # The gate below is only as trustworthy as the output it reads. A future
      # major bump could move the exit code again, exactly as v2 did, and an
      # unreadable value would silently mean "no broken links". Fail loudly
      # instead, so the check cannot go quiet without anyone noticing.
      - name: Verify the link checker reported an exit code
        if: steps.lychee.outputs.exit_code == ''
        run: |
          echo "::error::lychee-action reported no exit_code output, so broken links cannot be detected. Check whether the action renamed it."
          exit 1

      # lychee-action v1 exported the exit code as env.lychee_exit_code; v2
      # returns it as a step output instead. The v1 spelling survived the bump
      # to v2 in #4, and an undefined env value compares equal to 0, so this
      # step silently stopped running and the weekly check went unreported.
      - name: Create Issue if Links are Broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: ⚠️ Broken Links Detected in Database
          content-filepath: ./lychee-report.md
          labels: |
            maintenance
            automated-issue

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      # jsonschema lives in requirements-dev.txt, which is what the validation
      # step below needs; apply_link_status.py itself uses only the standard
      # library.
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      # Marks a record broken only for a response that proves the collection
      # has gone (404 or 410). Most of a real report is timeouts and 403/429/
      # 5xx, none of which tells the difference between a dead collection and
      # a slow or bot-averse server. The script exits non-zero if the report
      # cannot be parsed, so a format change fails the job rather than
      # quietly proposing that every link is healthy.
      - name: Propose broken-link status changes
        run: |
          python scripts/apply_link_status.py \
            --report ./lychee-report.md \
            --today "$(date -u +%F)"

      # A proposal that would not validate must never reach a pull request.
      - name: Validate the proposed dataset
        run: python scripts/validate_data.py

      - name: Open a Pull Request with the proposed changes
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automated/link-status
          delete-branch: true
          title: 'fix(data): update broken-link status from the weekly link check'
          commit-message: 'fix(data): update broken-link status from the weekly link check'
          labels: |
            maintenance
            automated-issue
          body: |
            Proposed `is_disabled` and `last_checked` changes from the weekly
            link check.

            Only a 404 or 410 marks a collection broken. Timeouts and
            403/429/5xx responses are left alone, because they describe the
            server on the day rather than whether the collection still
            exists.

            Check each URL before merging. A link can 404 because a
            catalogue moved rather than closed, in which case the fix is a
            new URL rather than a broken-link warning.
