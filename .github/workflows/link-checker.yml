name: Link Health Check

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Links in data.json
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--verbose --no-progress --timeout 10 ./docs/assets/data.json'
          fail: false
          output: ./lychee-report.md

      # The gate below is only as trustworthy as the output it reads. A future
      # major bump could move the exit code again, exactly as v2 did, and an
      # unreadable value would silently mean "no broken links". Fail loudly
      # instead, so the check cannot go quiet without anyone noticing.
      - name: Verify the link checker reported an exit code
        if: steps.lychee.outputs.exit_code == ''
        run: |
          echo "::error::lychee-action reported no exit_code output, so broken links cannot be detected. Check whether the action renamed it."
          exit 1

      # lychee-action v1 exported the exit code as env.lychee_exit_code; v2
      # returns it as a step output instead. The v1 spelling survived the bump
      # to v2 in #4, and an undefined env value compares equal to 0, so this
      # step silently stopped running and the weekly check went unreported.
      - name: Create Issue if Links are Broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: ⚠️ Broken Links Detected in Database
          content-filepath: ./lychee-report.md
          labels: |
            maintenance
            automated-issue
