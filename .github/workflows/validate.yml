# Data Validation Workflow
#
# Validates docs/assets/data.json on every pull request that touches it,
# and on manual dispatch. Runs scripts/validate_data.py, the same entry
# point .github/workflows/deploy.yml runs before building the site, which
# checks JSON syntax, schema compliance (required fields, data types, HTTP(S)
# URLs), duplicate ids, and aggregator name/URL uniqueness. It also checks the
# research ledger, reviewed assertions, stable aliases, and publication history.

name: Data Guardrails

on:
  pull_request:
    paths:
      - 'docs/assets/data.json'
      - 'docs/assets/library-aliases.json'
      - 'schema.json'
      - 'scripts/validate_data.py'
      - 'hooks/library_pages.py'
      - 'scripts/validate_identifier_evidence.py'
      - 'scripts/validate_link_assertions.py'
      - 'scripts/verify_identifier_history.py'
      - 'scripts/verify_link_assertion_history.py'
      - 'research/identifier-evidence.csv'
      - 'docs/assets/link-assertions.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate data.json
        run: python scripts/validate_data.py

      - name: Validate identifier evidence
        run: python scripts/validate_identifier_evidence.py

      - name: Validate reviewed link assertions
        run: python scripts/validate_link_assertions.py

      - name: Preserve published identifiers
        if: github.event_name == 'pull_request'
        run: python scripts/verify_identifier_history.py "${{ github.event.pull_request.base.sha }}"

      - name: Require approval for changed links
        if: github.event_name == 'pull_request'
        run: python scripts/verify_link_assertion_history.py "${{ github.event.pull_request.base.sha }}"
