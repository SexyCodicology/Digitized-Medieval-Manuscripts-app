# Data Validation Workflow
#
# Validates docs/assets/data.json on every pull request that touches it,
# and on manual dispatch. Runs scripts/validate_data.py, the same entry
# point .github/workflows/deploy.yml runs before building the site, which
# checks JSON syntax, schema compliance (required fields, data types, HTTP(S)
# URLs), duplicate ids, and aggregator name/URL uniqueness.

name: Data Guardrails

on:
  pull_request:
    paths:
      - 'docs/assets/data.json'
      - 'schema.json'
      - 'scripts/validate_data.py'
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate data.json
        run: python scripts/validate_data.py
